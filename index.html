<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 【データ出典・参考・情報提供元】
     国土交通省 北上川下流河川事務所 / 国土交通省 仙台河川国道事務所 / 宮城県 
     （UI最適化のためフッターからコード内に移動） -->
  <title>宮城県 防災カメラ・水位観測所ポータル</title>
  <meta name="description" content="石巻圏（石巻市・東松島市・女川町）の河川・道路定点観測カメラを地図上で一覧確認できるポータルサイト">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet.js v1.9.4 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- スタイルシート -->
  <link rel="stylesheet" href="css/style.css?v=20260811_1833">
</head>
<body>
  <div class="app-container">

    <!-- ========== ヘッダー ========== -->
    <header class="header">
      <div class="header-left">
        <div>
          <h1 class="header-title" style="white-space: nowrap; font-size: clamp(14px, 4vw, 18px); overflow: hidden; text-overflow: ellipsis;">
            <i class="fa-solid fa-camera-rotate" style="color: var(--accent); margin-right: 6px;"></i>
            <span class="title-pc">宮城県 防災カメラ・水位観測所ポータル</span>
            <span class="title-sp">宮城 防災・水位カメラ</span>
          </h1>
        </div>
        <!-- 地図折りたたみトグルボタン -->
        <button class="map-toggle-btn" id="map-toggle-btn" title="地図の表示・折りたたみ切り替え">
          <i class="fa-solid fa-map-location-dot" id="map-toggle-icon"></i>
          <span id="map-toggle-text">地図を隠す</span>
        </button>
      </div>
      <div class="header-right">
        <div class="area-filter-container">
          <button class="filter-btn area-btn" id="area-filter-btn">
            <i class="fa-solid fa-map-pin"></i>
            <span id="current-area-text">石巻圏</span>
            <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left: 4px;"></i>
          </button>
        </div>
        <div class="header-filters">
          <button class="filter-btn active" data-category="all">
            <i class="fa-solid fa-layer-group"></i>
            <span class="filter-text">すべて</span>
          </button>
          <button class="filter-btn" data-category="river">
            <i class="fa-solid fa-water"></i>
            <span class="filter-text">河川</span>
          </button>
          <button class="filter-btn" data-category="road">
            <i class="fa-solid fa-road"></i>
            <span class="filter-text">道路</span>
          </button>
          <button class="filter-btn" data-category="fav">
            <i class="fa-solid fa-star"></i>
            <span class="filter-text">お気に入り</span>
          </button>
        </div>
        <button class="filter-btn" id="info-btn" title="使い方・凡例" style="margin-left: 4px;">
          <i class="fa-solid fa-circle-info"></i>
          <span class="filter-text">凡例</span>
        </button>
      </div>
    </header>

    <!-- ========== 気象警報・注意報リアルタイムバー ========== -->
    <div id="weather-alert-bar" class="weather-alert-bar">
      <div class="weather-alert-loading">
        <i class="fa-solid fa-cloud-sun-rain fa-spin"></i> 気象警報情報を読み込んでいます...
      </div>
    </div>

    <!-- ========== ステータスバー ========== -->
    <div class="status-bar">
      <span class="camera-count">全 45 台</span>
      <div class="auto-refresh-indicator">
        <span class="pulse-dot"></span>
        <span class="countdown-timer">10:00</span>
        <button class="refresh-now-btn" title="手動更新">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>
    </div>

    <!-- ========== メインコンテンツエリア ========== -->
    <div class="main-content" id="main-content">
      
      <!-- 地図エリア（左側 / モバイル上部） -->
      <div class="map-container" id="map-container">
        <div id="map"></div>
      </div>

      <!-- サイドバー（右側 / モバイル下部） -->
      <aside class="sidebar" id="sidebar">
        <!-- 検索バー -->
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="search-input" placeholder="カメラ名・設置場所で検索..." autocomplete="off">
          <button class="clear-search-btn" id="clear-search-btn" title="クリア">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- カメラアコーディオンリスト -->
        <div class="accordion-container" id="camera-list">
          <!-- JSで動的にアコーディオンを生成 -->
        </div>
      </aside>

    </div>

    <!-- ========== スマホ用ボトムナビゲーション ========== -->
    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-item active" data-tab="map">
        <i class="fa-solid fa-map-location-dot"></i>
        <span>地図</span>
      </button>
      <button class="nav-item" data-tab="list">
        <i class="fa-solid fa-list-ul"></i>
        <span>一覧リスト</span>
      </button>
    </nav>

  </div>

  <!-- エリア選択ダイアログ -->
  <div class="modal-overlay" id="area-modal-overlay">
    <div class="area-modal-content">
      <div class="area-modal-header">
        <h3><i class="fa-solid fa-map-location-dot"></i> 表示エリアの選択</h3>
        <button class="modal-close" id="area-modal-close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="area-options-grid">
        <button class="area-option-btn active" data-area="ishinomaki">
          <strong>石巻圏</strong>
          <span>石巻市・東松島市・女川町</span>
        </button>
        <button class="area-option-btn" data-area="sendai">
          <strong>仙台圏</strong>
          <span>仙台市・塩竈市・名取市・多賀城市等</span>
        </button>
        <button class="area-option-btn" data-area="osaki">
          <strong>大崎圏</strong>
          <span>大崎市・加美町・美里町等</span>
        </button>
        <button class="area-option-btn" data-area="kurihara">
          <strong>栗原圏</strong>
          <span>栗原市全域</span>
        </button>
        <button class="area-option-btn" data-area="tome">
          <strong>登米圏</strong>
          <span>登米市全域</span>
        </button>
        <button class="area-option-btn" data-area="kesennuma">
          <strong>気仙沼圏</strong>
          <span>気仙沼市・南三陸町</span>
        </button>
        <button class="area-option-btn" data-area="sennan">
          <strong>仙南圏</strong>
          <span>白石市・角田市・大河原町等</span>
        </button>
        <button class="area-option-btn" data-area="all" style="grid-column: 1 / -1; background: rgba(255,255,255,0.05);">
          <strong>全域を表示</strong>
          <span>宮城県全域の全観測所</span>
        </button>
      </div>
    </div>
  </div>

  <!-- モーダル（画像・配信拡大表示用） -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title-area">
          <h2 class="modal-title" id="modal-title">カメラ名</h2>
          <div class="modal-badges" id="modal-badges"></div>
        </div>
        <button class="modal-close" id="modal-close" title="閉じる">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="modal-body">
        <div class="modal-media-wrapper" id="modal-media-wrapper">
          <!-- JSで動的に画像またはYouTube/ストリーム要素を生成 -->
        </div>

        <div class="modal-details" id="modal-details">
          <!-- 詳細情報（管理者、撮影方向など） -->
        </div>
      </div>

      <div class="modal-footer">
        <div style="font-size: 11px; color: var(--text-muted);" id="modal-time-info">
          <!-- 更新時刻 -->
        </div>
        <div class="modal-actions" id="modal-actions">
          <!-- 外部サイトリンクボタンなど -->
        </div>
      </div>
    </div>
  </div>

  <!-- 使い方・凡例モーダル -->
  <div class="modal-overlay" id="info-modal-overlay">
    <div class="info-modal-content" style="background: var(--bg-card); color: var(--text-primary); padding: 20px; border-radius: 12px; max-width: 480px; width: 90%; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2 style="font-size: 16px; font-weight: bold; margin: 0; color: var(--accent);"><i class="fa-solid fa-circle-info"></i> 使い方とアイコン凡例</h2>
        <button id="info-modal-close" style="background: none; border: none; color: var(--text-secondary); font-size: 18px; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div style="font-size: 12px; line-height: 1.6;">
        <h3 style="margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px;">■ カメラ・観測所アイコンの種類</h3>
        <ul style="list-style: none; padding: 0; margin-bottom: 16px;">
          <li style="margin-bottom: 4px;"><span class="filter-dot" style="background: var(--river); display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px;"></span>河川カメラ</li>
          <li style="margin-bottom: 4px;"><span class="filter-dot" style="background: var(--road); display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px;"></span>道路カメラ</li>
          <li style="margin-bottom: 4px;"><span class="filter-dot" style="background: #38bdf8; display:inline-block; width:12px; height:12px; border-radius:50%; border:2px solid #fff; margin-right:6px;"></span>水位観測所</li>
          <li style="margin-bottom: 4px;"><span class="filter-dot" style="background: #9ca3af; display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px;"></span>調整中・休止中</li>
        </ul>
        <h3 style="margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px;">■ 使い方</h3>
        <p style="margin-bottom: 8px;">・地図上のピンをクリックすると、カメラの最新画像が表示されます。</p>
        <p style="margin-bottom: 8px;">・画面上部の「エリア選択」から監視したい管内を選ぶと、対象のカメラだけが表示され、動作が軽くなります。</p>
        <p>・スマホの場合は、下の「カメラ一覧」タブからリスト形式でも確認できます。</p>
      </div>
    </div>
  </div>

  <!-- ========== JavaScript ========== -->
  <script>
    window.addEventListener('error', function(e) {
      document.body.innerHTML += '<div style="position:fixed;top:0;left:0;width:100%;background:red;color:white;z-index:9999;padding:10px;">エラー発生: ' + e.message + '<br>Line: ' + e.lineno + '</div>';
    });
  </script>
  <!-- カメラ・水位観測所データ -->
  <script src="js/water_level_stations.js?v=20260811_1833"></script>
  <script src="js/cameras.js?v=20260811_1833"></script>
  <!-- メインアプリケーション -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="js/app.js?v=20260811_1833"></script>

</body>
</html>
