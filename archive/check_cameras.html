<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カメラ位置 公式座標照合マップ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
        }
        #header {
            padding: 8px 12px;
            background: #1a1a2e;
            color: #e0e0e0;
            font-size: 13px;
            border-bottom: 2px solid #e94560;
        }
        #header b { color: #e94560; }
        #legend {
            display: flex;
            gap: 20px;
            margin-top: 4px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-current { background: #e94560; }
        .dot-official { background: #0f3460; }
        #map {
            flex-grow: 1;
            width: 100%;
        }
        #info-panel {
            height: 200px;
            padding: 8px;
            background: #16213e;
            color: #e0e0e0;
            border-top: 2px solid #e94560;
            overflow-y: auto;
            font-size: 12px;
            font-family: monospace;
        }
        .custom-tooltip {
            font-weight: bold;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="header">
        <b>カメラ位置 公式座標照合マップ</b>
        <div id="legend">
            <div class="legend-item"><span class="legend-dot dot-current"></span> cameras.js（現在の座標）</div>
            <div class="legend-item"><span class="legend-dot dot-official"></span> 国交省公式GeoJSON（静的展開済み）</div>
            <div class="legend-item">破線＝同一カメラの座標ズレ</div>
        </div>
    </div>
    <div id="map"></div>
    <div id="info-panel">データ読み込み中...</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- キャッシュ無効化パラメータ ?v=timestamp を付与 -->
    <script src="js/cameras.js?v=20260804_v6"></script>
    <script src="js/official_cameras.js?v=20260804_v6"></script>

    <script>
        const map = L.map('map').setView([38.50, 141.20], 11);
        const infoPanel = document.getElementById('info-panel');

        // 国土地理院 淡色地図
        L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
            attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank'>国土地理院</a>",
            maxZoom: 18
        }).addTo(map);

        // カスタムアイコン（赤：現在、青：公式）
        const currentIcon = L.divIcon({
            className: '',
            html: '<div style="width:10px;height:10px;background:#e94560;border-radius:50%;border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,0.5);"></div>',
            iconSize: [14, 14],
            iconAnchor: [7, 7]
        });
        const officialIcon = L.divIcon({
            className: '',
            html: '<div style="width:10px;height:10px;background:#0f3460;border-radius:50%;border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,0.5);"></div>',
            iconSize: [14, 14],
            iconAnchor: [7, 7]
        });

        function haversine(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function init() {
            infoPanel.innerHTML = '';

            const currentCameras = typeof CAMERA_DATA !== 'undefined' ? CAMERA_DATA : [];
            const officialCameras = typeof OFFICIAL_CAMERA_DATA !== 'undefined' ? OFFICIAL_CAMERA_DATA : [];

            infoPanel.innerHTML += `[1] cameras.js: ${currentCameras.length} 台<br>`;
            infoPanel.innerHTML += `[2] 国交省公式データ: ${officialCameras.length} 台<br>`;

            // 1. 赤ピン表示 (cameras.js)
            currentCameras.forEach(cam => {
                const marker = L.marker([cam.lat, cam.lng], {icon: currentIcon}).addTo(map);
                marker.bindTooltip(cam.name, {direction: 'top', className: 'custom-tooltip'});
                marker.bindPopup(`<b>【現在】${cam.name}</b><br>lat: ${cam.lat}<br>lng: ${cam.lng}`);
            });

            // 2. 青ピン表示 (公式データ)
            officialCameras.forEach(cam => {
                const marker = L.marker([cam.lat, cam.lon], {icon: officialIcon}).addTo(map);
                marker.bindTooltip(`[公式] ${cam.name}`, {direction: 'bottom', className: 'custom-tooltip'});
                marker.bindPopup(`<b>【公式】${cam.name}</b><br>lat: ${cam.lat}<br>lon: ${cam.lon}<br>sys_cam_id: ${cam.sys_cam_id}`);
            });

            // 3. 照合
            infoPanel.innerHTML += '<br>=== 照合・距離測定結果 ===<br>';
            let matchCount = 0;

            currentCameras.forEach(cam => {
                const keywords = cam.name
                    .replace(/北上川|迫川|江合川|鸣瀬川|吉田川|出来川|旧北上川|皿貝川|鞍坪川|釜谷川|三陸沿岸道路/g, '')
                    .trim();
                
                if (!keywords || keywords.length < 2) return;

                let bestMatch = null;
                let bestDist = Infinity;
                
                // --- 優先マッチ（オーバーライド） ---
                const overrides = {
                    "旧北上川 日和大橋": "日和大橋その他",
                    "旧北上川 真野川水門": "真野川水門左岸4.8km",
                    "鳴瀬川 鳴瀬大橋": "鳴瀬大橋2.7ｋｍ",
                    "北上川 福地水門": "福地水門",
                    "北上川 釜谷水門": "釜谷水門右岸",
                    "北上川 登米大橋": "登米大橋左岸54.2ｋｍ",
                    "北上川 錦桜橋": "錦桜橋左岸44.0ｋｍ",
                    "鳴瀬川 三本木": "三本木橋",
                    "江合川 2.8KP左岸": "江合川2.8kＲ",
                    "旧北上川 21.0KP左岸": "旧北上川21.0kＲ",
                    "鳴瀬川 小野橋上流": "小野橋4.2ｋｍ",
                    "北上川 下流7.4KP左岸": "北上川下流7.4kＲ",
                    "北上川 下流10.8KP左岸": "北上川下流10.8kＲ",
                    "皿貝川 長尾橋": "皿貝川"
                };

                if (overrides[cam.name]) {
                    bestMatch = officialCameras.find(oc => oc.name.includes(overrides[cam.name]));
                    if (bestMatch) {
                        bestDist = haversine(cam.lat, cam.lng, bestMatch.lat, bestMatch.lon);
                    }
                } else {
                    for (const off of officialCameras) {
                        if (off.name.includes(keywords) || keywords.includes(off.name)) {
                            const dist = haversine(cam.lat, cam.lng, off.lat, off.lon);
                            if (dist < bestDist) {
                                bestDist = dist;
                                bestMatch = off;
                            }
                        }
                    }
                }

                if (bestMatch && bestDist < 30000) { // 30km以内
                    matchCount++;
                    const dist = Math.round(bestDist);
                    const color = dist > 500 ? '#e94560' : dist > 100 ? '#f5a623' : '#00b894';
                    
                    if (dist > 10) {
                        L.polyline(
                            [[cam.lat, cam.lng], [bestMatch.lat, bestMatch.lon]],
                            {color: color, weight: 2, opacity: 0.8, dashArray: '5,5'}
                        ).addTo(map);
                    }

                    const icon = dist > 500 ? '❌' : dist > 100 ? '⚠️' : '✅';
                    infoPanel.innerHTML += `${icon} ${cam.name} → ${bestMatch.name}: ズレ ${dist}m<br>`;
                }
            });

            infoPanel.innerHTML += `<br>合計 ${matchCount} 件のマッチング線を描画しました。`;
        }

        init();
    </script>
</body>
</html>
