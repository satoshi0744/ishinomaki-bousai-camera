<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小規模テスト：画像表示の突破検証</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f9f9f9; }
        .test-case { border: 1px solid #ccc; background: #fff; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        .test-case h3 { margin-top: 0; color: #333; }
        img { max-width: 100%; border: 1px solid #999; background: #eee; min-height: 50px; display: block; margin-top: 10px; }
        .status { font-weight: bold; margin-top: 10px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>画像ブロック突破の小規模テスト</h1>
    <p>名取川のカメラ（PNG画像・ブロック対象）を様々な手法で読み込みます。</p>

    <div class="test-case">
        <h3>テスト1: 通常の img タグ</h3>
        <img src="https://cam.river.go.jp/cam/now/21033008.jpg" alt="テスト1画像" 
             onload="document.getElementById('status1').innerHTML = '⭕ 成功！'; document.getElementById('status1').className = 'status success';"
             onerror="document.getElementById('status1').innerHTML = '❌ 失敗'; document.getElementById('status1').className = 'status error';">
        <div id="status1" class="status">⏳ 読み込み中...</div>
    </div>

    <div class="test-case">
        <h3>テスト2: crossorigin="anonymous" 追加</h3>
        <img src="https://cam.river.go.jp/cam/now/21033008.jpg" crossorigin="anonymous" alt="テスト2画像" 
             onload="document.getElementById('status2').innerHTML = '⭕ 成功！'; document.getElementById('status2').className = 'status success';"
             onerror="document.getElementById('status2').innerHTML = '❌ 失敗'; document.getElementById('status2').className = 'status error';">
        <div id="status2" class="status">⏳ 読み込み中...</div>
    </div>

    <div class="test-case">
        <h3>テスト3: Fetch API + Blob 変換</h3>
        <img id="img3" alt="テスト3画像">
        <div id="status3" class="status">⏳ 処理中...</div>
    </div>

    <script>
        async function fetchImageAsBlob() {
            const statusDiv = document.getElementById('status3');
            try {
                const response = await fetch('https://cam.river.go.jp/cam/now/21033008.jpg', {
                    method: 'GET',
                    mode: 'no-cors',
                    cache: 'no-cache'
                });
                const blob = await response.blob();
                const objectURL = URL.createObjectURL(blob);
                
                const img = document.getElementById('img3');
                img.onload = () => {
                    statusDiv.innerHTML = '⭕ 成功！';
                    statusDiv.className = 'status success';
                };
                img.onerror = () => {
                    statusDiv.innerHTML = '❌ 失敗';
                    statusDiv.className = 'status error';
                };
                img.src = objectURL;
            } catch (error) {
                statusDiv.innerHTML = '❌ 失敗';
                statusDiv.className = 'status error';
            }
        }
        fetchImageAsBlob();
    </script>
</body>
</html>
