<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アイコンプレビュー</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }
    .icon-container {
      display: flex;
      gap: 40px;
      margin-top: 20px;
    }
    .icon-box {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #334155;
    }
    .icon-title {
      margin-top: 15px;
      font-size: 14px;
      color: #94a3b8;
    }
    
    /* ヘッダーでの実際の見え方シミュレーション */
    .header-sim {
      margin-top: 50px;
      background: #1e293b;
      padding: 15px 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 2px solid #0284c7;
    }
  </style>
</head>
<body>
  <h2>フクロウ（監視・見守り）アイコン プレビュー</h2>
  
  <div class="icon-container">
    
    <!-- パターン1：ソリッドで丸っこい -->
    <div class="icon-box">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#38bdf8" width="64" height="64">
        <!-- 丸い体と耳 -->
        <path d="M7,3 L9,7 L15,7 L17,3 L19,6 C20.3,7.5 21,9.5 21,11.5 C21,16.7 17,21 12,21 C7,21 3,16.7 3,11.5 C3,9.5 3.7,7.5 5,6 L7,3 Z M12,19 C15.9,19 19,15.6 19,11.5 C19,9.8 18.4,8.2 17.3,7 L6.7,7 C5.6,8.2 5,9.8 5,11.5 C5,15.6 8.1,19 12,19 Z" />
        <path d="M7,3 L9,7 L15,7 L17,3 L19,6 C20.3,7.5 21,9.5 21,11.5 C21,16.7 17,21 12,21 C7,21 3,16.7 3,11.5 C3,9.5 3.7,7.5 5,6 L7,3 Z" opacity="0.2"/>
        <!-- 両目（右目はカメラ風） -->
        <circle cx="8.5" cy="11.5" r="2.5" />
        <circle cx="15.5" cy="11.5" r="2.5" fill="none" stroke="#38bdf8" stroke-width="1.5" />
        <circle cx="15.5" cy="11.5" r="1.2" />
        <!-- くちばし -->
        <polygon points="12,14.5 11,16.5 13,16.5" />
      </svg>
      <div class="icon-title">パターン1: 丸み＆カメラ目</div>
    </div>

    <!-- パターン2：よりシンプルで優しい顔 -->
    <div class="icon-box">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="64" height="64">
        <path d="M5 8c0-2.8 1.5-5.2 3.8-6.4a1 1 0 0 1 1.4.9v2.5a6.9 6.9 0 0 1 3.6 0V2.5a1 1 0 0 1 1.4-.9C17.5 2.8 19 5.2 19 8c0 5-3.1 9-7 9s-7-4-7-9z"/>
        <circle cx="9" cy="8" r="1.5" fill="#38bdf8" stroke="none" />
        <circle cx="15" cy="8" r="1.5" fill="#38bdf8" stroke="none" />
        <path d="M11 12l1 1 1-1" />
        <!-- 体の下部のカメラレンズ表現 -->
        <circle cx="12" cy="17" r="4" />
        <circle cx="12" cy="17" r="1.5" fill="#38bdf8" stroke="none"/>
      </svg>
      <div class="icon-title">パターン2: 優しさ＆下部レンズ</div>
    </div>

  </div>

  <div class="header-sim">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#38bdf8" width="24" height="24" style="margin-right: 8px;">
        <path d="M7,3 L9,7 L15,7 L17,3 L19,6 C20.3,7.5 21,9.5 21,11.5 C21,16.7 17,21 12,21 C7,21 3,16.7 3,11.5 C3,9.5 3.7,7.5 5,6 L7,3 Z M12,19 C15.9,19 19,15.6 19,11.5 C19,9.8 18.4,8.2 17.3,7 L6.7,7 C5.6,8.2 5,9.8 5,11.5 C5,15.6 8.1,19 12,19 Z" />
        <path d="M7,3 L9,7 L15,7 L17,3 L19,6 C20.3,7.5 21,9.5 21,11.5 C21,16.7 17,21 12,21 C7,21 3,16.7 3,11.5 C3,9.5 3.7,7.5 5,6 L7,3 Z" opacity="0.2"/>
        <circle cx="8.5" cy="11.5" r="2.5" />
        <circle cx="15.5" cy="11.5" r="2.5" fill="none" stroke="#38bdf8" stroke-width="1.5" />
        <circle cx="15.5" cy="11.5" r="1.2" />
        <polygon points="12,14.5 11,16.5 13,16.5" />
    </svg>
    宮城県 防災カメラ・水位観測所ポータル
  </div>

</body>
</html>
