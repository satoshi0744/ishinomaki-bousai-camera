<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アイコンプレビュー（改）</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }
    .icon-container {
      display: flex;
      gap: 40px;
      margin-top: 20px;
    }
    .icon-box {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #334155;
    }
    .icon-title {
      margin-top: 15px;
      font-size: 14px;
      color: #94a3b8;
    }
    
    .header-sim {
      margin-top: 50px;
      background: #1e293b;
      padding: 15px 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 2px solid #0284c7;
    }
  </style>
</head>
<body>
  <h2>見守るフクロウ アイコン（かわいさUP調整版）</h2>
  
  <div class="icon-container">
    
    <div class="icon-box">
      <!-- 両目がカメラレンズ + フォルムを少し丸く・耳を短めに -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#38bdf8" width="80" height="80">
        <!-- 丸い体と少し短めの耳 -->
        <path d="M7.5,4 L9.5,7 L14.5,7 L16.5,4 L18.5,6 C20,7.5 21,9.5 21,12 C21,17 17,21 12,21 C7,21 3,17 3,12 C3,9.5 4,7.5 5.5,6 L7.5,4 Z" opacity="0.2"/>
        <path d="M7.5,4 L9.5,7 L14.5,7 L16.5,4 L18.5,6 C20,7.5 21,9.5 21,12 C21,17 17,21 12,21 C7,21 3,17 3,12 C3,9.5 4,7.5 5.5,6 L7.5,4 Z M12,19 C15.9,19 19,16 19,12 C19,10 18.2,8.5 17,7.5 L7,7.5 C5.8,8.5 5,10 5,12 C5,16 8.1,19 12,19 Z" />
        
        <!-- 左目（カメラレンズ風・大きめ） -->
        <circle cx="8.5" cy="12" r="2.8" fill="none" stroke="#38bdf8" stroke-width="1.5" />
        <circle cx="8.5" cy="12" r="1.2" />
        
        <!-- 右目（カメラレンズ風・大きめ） -->
        <circle cx="15.5" cy="12" r="2.8" fill="none" stroke="#38bdf8" stroke-width="1.5" />
        <circle cx="15.5" cy="12" r="1.2" />
        
        <!-- くちばし（小さく可愛く） -->
        <path d="M11.2,15.2 C11.6,14.8 12.4,14.8 12.8,15.2 L13.2,15.6 C13.5,15.9 13.3,16.5 12.8,16.5 L11.2,16.5 C10.7,16.5 10.5,15.9 10.8,15.6 L11.2,15.2 Z" />
      </svg>
      <div class="icon-title">調整版フクロウ</div>
    </div>

  </div>

  <div class="header-sim">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#38bdf8" width="24" height="24" style="margin-right: 8px;">
        <path d="M7.5,4 L9.5,7 L14.5,7 L16.5,4 L18.5,6 C20,7.5 21,9.5 21,12 C21,17 17,21 12,21 C7,21 3,17 3,12 C3,9.5 4,7.5 5.5,6 L7.5,4 Z" opacity="0.2"/>
        <path d="M7.5,4 L9.5,7 L14.5,7 L16.5,4 L18.5,6 C20,7.5 21,9.5 21,12 C21,17 17,21 12,21 C7,21 3,17 3,12 C3,9.5 4,7.5 5.5,6 L7.5,4 Z M12,19 C15.9,19 19,16 19,12 C19,10 18.2,8.5 17,7.5 L7,7.5 C5.8,8.5 5,10 5,12 C5,16 8.1,19 12,19 Z" />
        <circle cx="8.5" cy="12" r="2.8" fill="none" stroke="#38bdf8" stroke-width="1.5" />
        <circle cx="8.5" cy="12" r="1.2" />
        <circle cx="15.5" cy="12" r="2.8" fill="none" stroke="#38bdf8" stroke-width="1.5" />
        <circle cx="15.5" cy="12" r="1.2" />
        <path d="M11.2,15.2 C11.6,14.8 12.4,14.8 12.8,15.2 L13.2,15.6 C13.5,15.9 13.3,16.5 12.8,16.5 L11.2,16.5 C10.7,16.5 10.5,15.9 10.8,15.6 L11.2,15.2 Z" />
    </svg>
    宮城県 防災カメラ・水位観測所ポータル
  </div>

</body>
</html>
