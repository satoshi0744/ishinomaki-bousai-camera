<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>みやぎライブEyes - フクロウアイコン ダウンロード</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      margin: 0;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      text-align: center;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 30px;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 960px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    .preview-box {
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      margin-bottom: 20px;
      border: 1px dashed #475569;
    }
    .bg-transparent-light {
      background: #ffffff;
      background-image: linear-gradient(45deg, #f1f5f9 25%, transparent 25%), linear-gradient(-45deg, #f1f5f9 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f1f5f9 75%), linear-gradient(-45deg, transparent 75%, #f1f5f9 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }
    .bg-transparent-dark {
      background: #1e293b;
      background-image: linear-gradient(45deg, #0f172a 25%, transparent 25%), linear-gradient(-45deg, #0f172a 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #0f172a 75%), linear-gradient(-45deg, transparent 75%, #0f172a 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }
    .bg-circle-dark {
      background: #090d16;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .card-desc {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 20px;
      text-align: center;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    button.btn-secondary {
      background: #334155;
    }
    button.btn-secondary:hover {
      background: #475569;
    }
  </style>
</head>
<body>

  <h1>🦉 フクロウアイコン モノクロPNGダウンロード</h1>
  <p>用途に合わせて、透過背景の黒・白、アプリアイコン風など各サイズでダウンロードできます。</p>

  <div class="grid">

    <!-- 1. 黒フクロウ（透過背景） -->
    <div class="card">
      <div class="card-title">① 黒アイコン（透過PNG）</div>
      <div class="card-desc">白背景や明るい用紙・名刺・書類向け</div>
      <div class="preview-box bg-transparent-light">
        <svg id="svg-black" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#000000" width="80" height="80">
          <path d="M7.5,4 L9.5,7 L14.5,7 L16.5,4 L18.5,6 C20,7.5 21,9.5 21,12 C21,17 17,21 12,21 C7,21 3,17 3,12 C3,9.5 4,7.5 5.5,6 L7.5,4 Z" opacity="0.15"/>
          <path d="M7.5,4 L9.5,7 L14.5,7 L16.5,4 L18.5,6 C20,7.5 21,9.5 21,12 C21,17 17,21 12,21 C7,21 3,17 3,12 C3,9.5 4,7.5 5.5,6 L7.5,4 Z M12,19 C15.9,19 19,16 19,12 C19,10 18.2,8.5 17,7.5 L7,7.5 C5.8,8.5 5,10 5,12 C5,16 8.1,19 12,19 Z" />
          <circle cx="8.5" cy="12" r="2.8" fill="none" stroke="#000000" stroke-width="1.5" />
          <circle cx="8.5" cy="12" r="1.2" />
          <circle cx="15.5" cy="12" r="2.8" fill="none" stroke="#000000" stroke-width="1.5" />
          <circle cx="15.5" cy="12" r="1.2" />
          <path d="M11.2,15.2 C11.6,14.8 12.4,14.8 12.8,15.2 L13.2,15.6 C13.5,15.9 13.3,16.5 12.8,16.5 L11.2,16.5 C10.7,16.5 10.5,15.9 10.8,15.6 L11.2,15.2 Z" />
        </svg>
      </div>
      <div class="btn-group">
        <button onclick="downloadPng('svg-black', 'owl_icon_black_512.png', 512, false)">📥 512 × 512 px を保存</button>
        <button class="btn-secondary" onclick="downloadPng('svg-black', 'owl_icon_black_1024.png', 1024, false)">📥 1024 × 1024 px（高画質）</button>
      </div>
    </div>

    <!-- 2. 白フクロウ（透過PNG） -->
    <div class="card">
      <div class="card-title">② 白アイコン（透過PNG）</div>
      <div class="card-desc">黒背景・ダークモード・写真への重ね合わせ向け</div>
      <div class="preview-box bg-transparent-dark">
        <svg id="svg-white" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#ffffff" width="80" height="80">
          <path d="M7.5,4 L9.5,7 L14.5,7 L16.5,4 L18.5,6 C20,7.5 21,9.5 21,12 C21,17 17,21 12,21 C7,21 3,17 3,12 C3,9.5 4,7.5 5.5,6 L7.5,4 Z" opacity="0.25"/>
          <path d="M7.5,4 L9.5,7 L14.5,7 L16.5,4 L18.5,6 C20,7.5 21,9.5 21,12 C21,17 17,21 12,21 C7,21 3,17 3,12 C3,9.5 4,7.5 5.5,6 L7.5,4 Z M12,19 C15.9,19 19,16 19,12 C19,10 18.2,8.5 17,7.5 L7,7.5 C5.8,8.5 5,10 5,12 C5,16 8.1,19 12,19 Z" />
          <circle cx="8.5" cy="12" r="2.8" fill="none" stroke="#ffffff" stroke-width="1.5" />
          <circle cx="8.5" cy="12" r="1.2" />
          <circle cx="15.5" cy="12" r="2.8" fill="none" stroke="#ffffff" stroke-width="1.5" />
          <circle cx="15.5" cy="12" r="1.2" />
          <path d="M11.2,15.2 C11.6,14.8 12.4,14.8 12.8,15.2 L13.2,15.6 C13.5,15.9 13.3,16.5 12.8,16.5 L11.2,16.5 C10.7,16.5 10.5,15.9 10.8,15.6 L11.2,15.2 Z" />
        </svg>
      </div>
      <div class="btn-group">
        <button onclick="downloadPng('svg-white', 'owl_icon_white_512.png', 512, false)">📥 512 × 512 px を保存</button>
        <button class="btn-secondary" onclick="downloadPng('svg-white', 'owl_icon_white_1024.png', 1024, false)">📥 1024 × 1024 px（高画質）</button>
      </div>
    </div>

    <!-- 3. 白フクロウ（黒丸背景・アプリアイコン風） -->
    <div class="card">
      <div class="card-title">③ 黒丸バッジ（PNG）</div>
      <div class="card-desc">SNSアイコン・ファビコン・アプリアイコン向け</div>
      <div class="preview-box bg-circle-dark">
        <svg id="svg-badge" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#ffffff" width="80" height="80">
          <path d="M7.5,4 L9.5,7 L14.5,7 L16.5,4 L18.5,6 C20,7.5 21,9.5 21,12 C21,17 17,21 12,21 C7,21 3,17 3,12 C3,9.5 4,7.5 5.5,6 L7.5,4 Z" opacity="0.25"/>
          <path d="M7.5,4 L9.5,7 L14.5,7 L16.5,4 L18.5,6 C20,7.5 21,9.5 21,12 C21,17 17,21 12,21 C7,21 3,17 3,12 C3,9.5 4,7.5 5.5,6 L7.5,4 Z M12,19 C15.9,19 19,16 19,12 C19,10 18.2,8.5 17,7.5 L7,7.5 C5.8,8.5 5,10 5,12 C5,16 8.1,19 12,19 Z" />
          <circle cx="8.5" cy="12" r="2.8" fill="none" stroke="#ffffff" stroke-width="1.5" />
          <circle cx="8.5" cy="12" r="1.2" />
          <circle cx="15.5" cy="12" r="2.8" fill="none" stroke="#ffffff" stroke-width="1.5" />
          <circle cx="15.5" cy="12" r="1.2" />
          <path d="M11.2,15.2 C11.6,14.8 12.4,14.8 12.8,15.2 L13.2,15.6 C13.5,15.9 13.3,16.5 12.8,16.5 L11.2,16.5 C10.7,16.5 10.5,15.9 10.8,15.6 L11.2,15.2 Z" />
        </svg>
      </div>
      <div class="btn-group">
        <button onclick="downloadPng('svg-badge', 'owl_icon_badge_512.png', 512, true)">📥 512 × 512 px を保存</button>
        <button class="btn-secondary" onclick="downloadPng('svg-badge', 'owl_icon_badge_1024.png', 1024, true)">📥 1024 × 1024 px（高画質）</button>
      </div>
    </div>

  </div>

  <canvas id="export-canvas" style="display: none;"></canvas>

  <script>
    function downloadPng(svgId, filename, size, hasDarkBg) {
      const svgEl = document.getElementById(svgId);
      const serializer = new XMLSerializer();
      let svgStr = serializer.serializeToString(svgEl);

      const canvas = document.getElementById('export-canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, size, size);

      if (hasDarkBg) {
        // 円形背景を描画
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, (size / 2) - (size * 0.02), 0, Math.PI * 2);
        ctx.fill();
      }

      const img = new Image();
      const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);

      img.onload = function() {
        // パディングを少し取って中央に綺麗に描画
        const padding = hasDarkBg ? size * 0.18 : size * 0.08;
        const drawSize = size - (padding * 2);
        ctx.drawImage(img, padding, padding, drawSize, drawSize);
        URL.revokeObjectURL(url);

        const a = document.createElement('a');
        a.download = filename;
        a.href = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };
      img.src = url;
    }
  </script>

</body>
</html>
